name: Validate HA-Bandwidth
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Compile Python files
        run: python -m compileall -q ha_bandwidth
      - name: Check runtime modules are present in the Docker image
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          root = Path("ha_bandwidth")
          dockerfile = (root / "Dockerfile").read_text()
          copy = " ".join(line for line in dockerfile.splitlines() if line.startswith("COPY "))
          module = ast.parse((root / "monitor.py").read_text())
          names = {item.module for item in module.body if isinstance(item, ast.ImportFrom) and item.module}
          names |= {alias.name for item in module.body if isinstance(item, ast.Import) for alias in item.names}
          required = {name for name in names if (root / (name + ".py")).exists()}
          missing = sorted(name for name in required if name + ".py" not in copy)
          if missing:
              raise SystemExit("Missing runtime Python modules in Docker COPY: " + ", ".join(missing))
          print("Docker runtime modules present:", ", ".join(sorted(required)))
          PY
      - name: Install unit-test dependencies
        run: python -m pip install 'paho-mqtt==2.1.0' 'websocket-client==1.9.0'
      - name: Run unit tests
        run: python -m unittest discover -s ha_bandwidth -p 'test_*.py' -v
      - name: Check JavaScript module syntax
        run: node --input-type=module --check < ha_bandwidth/dashboard.js
      - name: Install dashboard test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tests/ui
      - name: Run dashboard UI tests
        run: npm test
        working-directory: tests/ui
      - name: Build and smoke-test the add-on
        run: bash .github/scripts/smoke-test.sh
