name: Synchroniseer centrale Home Assistant-appstore
on:
  release:
    types: [published]
  workflow_run:
    workflows: [Publiceer HA-Bandwidth-versie]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions: {}
jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Start synchronisatie in ferrynl/ha-apps
        env:
          GH_TOKEN: ${{ secrets.HA_APPS_SYNC_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Stel het Actions-secret HA_APPS_SYNC_TOKEN in met Actions: Read and write voor ferrynl/ha-apps."
            exit 1
          fi
          gh workflow run sync-apps.yml --repo ferrynl/ha-apps --ref main
