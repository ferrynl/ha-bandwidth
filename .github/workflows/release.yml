name: Publiceer HA-Bandwidth-versie
on:
  push:
    branches: [main]
    paths: [ha_bandwidth/config.yaml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ha-bandwidth-release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publiceer GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version: "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' ha_bandwidth/config.yaml)
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          awk -v heading="## $version" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found { print }
          ' ha_bandwidth/CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --target "$GITHUB_SHA" --title "HA-Bandwidth $version" --notes-file "$RUNNER_TEMP/release-notes.md"
