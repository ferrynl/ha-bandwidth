name: HA-Bandwidth
slug: ha_bandwidth
version: "0.1.0"
description: Netwerkverkeer van de Home Assistant-server en apps
url: https://github.com/ferrynl/ha-bandwidth
arch:
  - amd64
  - aarch64
startup: application
init: false
host_network: true
docker_api: true
privileged:
  - NET_RAW
ingress: true
ingress_port: 63187
panel_admin: true
panel_icon: mdi:chart-timeline-variant
options:
  interface: auto
  timezone: Europe/Amsterdam
  track_peers: true
schema:
  interface: str
  timezone: str
  track_peers: bool
